<!--
  3e8 — Hero section component
  Standalone, dependency-free markup + styles. Drop the <section class="hero-3e8">
  block into any page and keep the <style> block (or move its rules into your
  own stylesheet) — scoped under .hero-3e8 so it won't leak into surrounding UI.
-->
<style>
  .hero-3e8 {
    --bg: #fafaf8;
    --ink: #141414;
    --muted: #6b6f76;
    --border: #e4e2dc;
    --cta-bg: #141414;
    --cta-ink: #ffffff;
    --input-bg: #f0efe9;

    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: clamp(56px, 10vw, 120px) 20px clamp(48px, 8vw, 96px);
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    .hero-3e8:not([data-theme="light"]) {
      --bg: #111113;
      --ink: #f2f1ee;
      --muted: #9a9da3;
      --border: #2a2a2d;
      --cta-bg: #f2f1ee;
      --cta-ink: #141414;
      --input-bg: #1c1c1f;
    }
  }
  .hero-3e8[data-theme="dark"] {
    --bg: #111113;
    --ink: #f2f1ee;
    --muted: #9a9da3;
    --border: #2a2a2d;
    --cta-bg: #f2f1ee;
    --cta-ink: #141414;
    --input-bg: #1c1c1f;
  }

  .hero-3e8__inner {
    max-width: 760px;
    margin: 0 auto;
  }

  .hero-3e8__eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .hero-3e8__headline {
    font-family: inherit;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-size: clamp(36px, 6.5vw, 72px);
    margin: 0 0 28px;
  }

  .hero-3e8__headline em {
    font-style: normal;
    color: var(--muted);
  }

  .hero-3e8__subhead {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: clamp(17px, 2.2vw, 20px);
    line-height: 1.55;
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto clamp(32px, 5vw, 44px);
  }

  .hero-3e8__cta {
    display: flex;
    align-items: center;
    gap: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
  }

  .hero-3e8__cta input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-size: 14px;
    color: var(--ink);
    padding: 12px 14px;
  }

  .hero-3e8__cta input::placeholder {
    color: var(--muted);
  }

  .hero-3e8__cta button {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    background: var(--cta-bg);
    color: var(--cta-ink);
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    cursor: pointer;
  }

  @media (max-width: 420px) {
    .hero-3e8__cta {
      flex-direction: column;
      background: transparent;
      border: none;
      padding: 0;
      gap: 10px;
    }
    .hero-3e8__cta input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .hero-3e8__cta button {
      width: 100%;
    }
  }
</style>

<section class="hero-3e8">
  <div class="hero-3e8__inner">
    <p class="hero-3e8__eyebrow"># The AI-native firm for market research</p>
    <h1 class="hero-3e8__headline">
      Biopharma market research —<br />
      <em>rebuilt around AI.</em>
    </h1>
    <p class="hero-3e8__subhead">
      3e8 delivers market insights using an AI-native model, enabling richer
      insights that arrive in days, not weeks.
    </p>
    <form class="hero-3e8__cta">
      <input type="email" placeholder="Work email…" required />
      <button type="submit">Request access →</button>
    </form>
  </div>
</section>
