<!--
  3e8 — Hero section component
  Standalone, dependency-free markup + styles. Drop the <section class="hero-3e8">
  block into any page and keep the <style> block (or move its rules into your
  own stylesheet) — scoped under .hero-3e8 so it won't leak into surrounding UI.
-->
<style>
  .hero-3e8 {
    --bg: #fafaf8;
    --ink: #141414;
    --muted: #6b6f76;
    --border: #e4e2dc;
    --cta-bg: #141414;
    --cta-ink: #ffffff;
    --input-bg: #f0efe9;
    --dot: rgb(20 20 20 / 0.14);
    --blob-a: rgb(120 140 130 / 0.20);
    --blob-b: rgb(150 130 110 / 0.18);

    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    padding: clamp(56px, 10vw, 120px) 20px clamp(48px, 8vw, 96px);
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    .hero-3e8:not([data-theme="light"]) {
      --bg: #111113;
      --ink: #f2f1ee;
      --muted: #9a9da3;
      --border: #2a2a2d;
      --cta-bg: #f2f1ee;
      --cta-ink: #141414;
      --input-bg: #1c1c1f;
      --dot: rgb(255 255 255 / 0.10);
      --blob-a: rgb(90 130 150 / 0.16);
      --blob-b: rgb(140 110 150 / 0.14);
    }
  }
  .hero-3e8[data-theme="dark"] {
    --bg: #111113;
    --ink: #f2f1ee;
    --muted: #9a9da3;
    --border: #2a2a2d;
    --cta-bg: #f2f1ee;
    --cta-ink: #141414;
    --input-bg: #1c1c1f;
    --dot: rgb(255 255 255 / 0.10);
    --blob-a: rgb(90 130 150 / 0.16);
    --blob-b: rgb(140 110 150 / 0.14);
  }

  .hero-3e8__bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 90%);
  }

  .hero-3e8__blob {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    width: 46vw;
    height: 46vw;
    max-width: 560px;
    max-height: 560px;
    border-radius: 50%;
    filter: blur(70px);
    animation: hero-3e8-drift 26s ease-in-out infinite alternate;
  }

  .hero-3e8__blob--a {
    top: -12%;
    left: -8%;
    background: var(--blob-a);
  }

  .hero-3e8__blob--b {
    bottom: -18%;
    right: -8%;
    background: var(--blob-b);
    animation-duration: 32s;
    animation-delay: -6s;
  }

  @keyframes hero-3e8-drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(4%, 5%) scale(1.08); }
    100% { transform: translate(-3%, -4%) scale(0.96); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-3e8__blob {
      animation: none;
    }
  }

  .hero-3e8__inner {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
  }

  .hero-3e8__eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .hero-3e8__headline {
    font-family: inherit;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    font-size: clamp(36px, 6.5vw, 72px);
    margin: 0 0 28px;
  }

  .hero-3e8__subhead {
    font-family: inherit;
    font-size: clamp(15px, 1.8vw, 17px);
    line-height: 1.6;
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto clamp(32px, 5vw, 44px);
  }

  .hero-3e8__cta {
    display: flex;
    align-items: center;
    gap: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
  }

  .hero-3e8__cta input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-size: 14px;
    color: var(--ink);
    padding: 12px 14px;
  }

  .hero-3e8__cta input::placeholder {
    color: var(--muted);
  }

  .hero-3e8__cta button {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    background: var(--cta-bg);
    color: var(--cta-ink);
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    cursor: pointer;
  }

  @media (max-width: 420px) {
    .hero-3e8__cta {
      flex-direction: column;
      background: transparent;
      border: none;
      padding: 0;
      gap: 10px;
    }
    .hero-3e8__cta input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .hero-3e8__cta button {
      width: 100%;
    }
  }
</style>

<section class="hero-3e8">
  <div class="hero-3e8__bg" aria-hidden="true"></div>
  <div class="hero-3e8__blob hero-3e8__blob--a" aria-hidden="true"></div>
  <div class="hero-3e8__blob hero-3e8__blob--b" aria-hidden="true"></div>
  <div class="hero-3e8__inner">
    <p class="hero-3e8__eyebrow"># The AI-native firm for market research</p>
    <h1 class="hero-3e8__headline">Agentic market research</h1>
    <p class="hero-3e8__subhead">
      3e8 delivers market research using an AI-native model, enabling richer
      insights that arrive in days, not weeks.
    </p>
    <form class="hero-3e8__cta">
      <input type="email" placeholder="Work email…" required />
      <button type="submit">Request access →</button>
    </form>
  </div>
</section>
